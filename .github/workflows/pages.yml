name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build public site
        run: python scripts/build_public.py

      - name: Verify public output
        run: |
          test -f public/index.html
          test -f public/sitemap.xml
          test -f public/robots.txt
          test -f public/guide/img/og-default.png
          find public -iname '*audit*.md' -o -iname '*report*.md' -o -iname '*stage*.md' -o -iname '*check*.md' | tee /tmp/public-forbidden.txt
          test ! -s /tmp/public-forbidden.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
